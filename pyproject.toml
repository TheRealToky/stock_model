[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-lab"
version = "0.1.0"
description = "Modular quantitative research lab for financial strategy development"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.25",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "yfinance>=0.2.30",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]
jupyter = [
    "jupyterlab>=4.0",
    "ipywidgets>=8.1",
]
vectorbt = [
    "vectorbt>=0.26",
]
backtrader = [
    "backtrader>=1.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
