[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-lab"
version = "0.1.0"
description = "Modular quantitative research lab for financial strategy development"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.2",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "yfinance>=0.2.50",
    "scikit-learn>=1.6",
    "xgboost>=2.1",
    "joblib>=1.4",
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "loguru>=0.7",
    "pyarrow>=19.0",
    "duckdb>=1.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]
torch = [
    "torch>=2.6",
]
jupyter = [
    "jupyterlab>=4.3",
    "ipywidgets>=8.1",
]
vectorbt = [
    "vectorbt>=0.26",
]
backtrader = [
    "backtrader>=1.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
