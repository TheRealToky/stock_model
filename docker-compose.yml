# =============================================================================
# Quant Lab - Docker Compose
# =============================================================================
#
# Services:
#   timescaledb  - TimescaleDB (PostgreSQL 16) with persistent volume
#   python-app   - Python research / pipeline container
#   jupyter      - JupyterLab notebook server
#
# Usage:
#   docker compose up -d            # start all services
#   docker compose up -d timescaledb # start only the database
#   docker compose logs -f jupyter   # follow Jupyter logs for the token URL
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # TimescaleDB
  # ---------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: quantlab-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TIMESCALE_DB:-quantlab}
      POSTGRES_USER: ${TIMESCALE_USER:-quantlab}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-quantlab_secret}
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    networks:
      - quantlab-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-quantlab} -d ${TIMESCALE_DB:-quantlab}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Python application / research container
  # ---------------------------------------------------------------------------
  python-app:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    container_name: quantlab-python
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app
      - pip_cache:/root/.cache/pip
    networks:
      - quantlab-net
    depends_on:
      timescaledb:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # JupyterLab
  # ---------------------------------------------------------------------------
  jupyter:
    build:
      context: .
      dockerfile: docker/Dockerfile.jupyter
    container_name: quantlab-jupyter
    restart: unless-stopped
    env_file:
      - .env
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-quantlab}
    ports:
      - "8888:8888"
    volumes:
      - .:/app
      - pip_cache:/root/.cache/pip
    networks:
      - quantlab-net
    depends_on:
      timescaledb:
        condition: service_healthy

# =============================================================================
# Volumes & Networks
# =============================================================================
volumes:
  timescaledb_data:
    driver: local
  pip_cache:
    driver: local

networks:
  quantlab-net:
    driver: bridge
