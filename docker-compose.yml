# =============================================================================
# Quant Lab - Docker Compose
# =============================================================================
#
# Services:
#   timescaledb    - TimescaleDB (PostgreSQL 16) for OHLCV / financial data
#   python-app     - Python research / pipeline container (financial side)
#   jupyter        - JupyterLab notebook server
#   jupyter-torch  - JupyterLab + PyTorch (port 8889, torch baked into image)
#   alt-postgres   - PostgreSQL 16 dedicated to alternative data
#   alt-pipeline   - Python service container for the alt-data pipeline
#
# Usage:
#   docker compose up -d                   # start everything
#   docker compose up -d timescaledb       # start only the financial DB
#   docker compose up -d alt-postgres alt-pipeline   # only the alt stack
#   docker compose logs -f jupyter         # follow Jupyter logs for the token URL
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # TimescaleDB (financial / OHLCV data)
  # ---------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: quantlab-timescaledb
    restart: unless-stopped
    command: postgres -c max_locks_per_transaction=256
    environment:
      POSTGRES_DB: ${TIMESCALE_DB:-quantlab}
      POSTGRES_USER: ${TIMESCALE_USER:-quantlab}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-quantlab_secret}
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    networks:
      - quantlab-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-quantlab} -d ${TIMESCALE_DB:-quantlab}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Python application / research container
  # ---------------------------------------------------------------------------
  python-app:
    build:
      context: .
      dockerfile: docker/Dockerfile.financials
    container_name: quantlab-python
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app
      - pip_cache:/root/.cache/pip
    networks:
      - quantlab-net
    depends_on:
      timescaledb:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # JupyterLab
  # ---------------------------------------------------------------------------
  jupyter:
    build:
      context: .
      dockerfile: docker/Dockerfile.jupyter
    container_name: quantlab-jupyter
    restart: unless-stopped
    env_file:
      - .env
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-quantlab}
    ports:
      - "8889:8889"
    volumes:
      - .:/app
      - pip_cache:/root/.cache/pip
    networks:
      - quantlab-net
    depends_on:
      timescaledb:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # JupyterLab + PyTorch (PyTorch baked into base image)
  # ---------------------------------------------------------------------------
  jupyter-torch:
    build:
      context: .
      dockerfile: docker/Dockerfile.jupyter-torch
    container_name: quantlab-jupyter-torch
    restart: unless-stopped
    env_file:
      - .env
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-quantlab}
    ports:
      - "8888:8888"
    volumes:
      - .:/app
      - pip_cache:/root/.cache/pip
    networks:
      - quantlab-net
    depends_on:
      timescaledb:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Alt-data PostgreSQL
  # ---------------------------------------------------------------------------
  alt-postgres:
    image: postgres:16
    container_name: alt-data-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ALT_DB_NAME:-alt_data}
      POSTGRES_USER: ${ALT_DB_USER:-alt_user}
      POSTGRES_PASSWORD: ${ALT_DB_PASSWORD:-alt_secret}
    ports:
      - "5433:5432"
    volumes:
      - alt_postgres_data:/var/lib/postgresql/data
    networks:
      - alt-data-net
      - quantlab-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ALT_DB_USER:-alt_user} -d ${ALT_DB_NAME:-alt_data}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Alt-data pipeline service
  # ---------------------------------------------------------------------------
  alt-pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.alt_data
    container_name: alt-data-pipeline
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Alt-data DB (inside the alt-data-net)
      ALT_DB_HOST: alt-postgres
      ALT_DB_PORT: "5432"
      ALT_DB_NAME: ${ALT_DB_NAME:-alt_data}
      ALT_DB_USER: ${ALT_DB_USER:-alt_user}
      ALT_DB_PASSWORD: ${ALT_DB_PASSWORD:-alt_secret}

      # Financial DB (lives on the quantlab-net)
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: "5432"
      TIMESCALE_DB: ${TIMESCALE_DB:-quantlab}
      TIMESCALE_USER: ${TIMESCALE_USER:-quantlab}
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-quantlab_secret}

      # OpenSky OAuth2 credentials (client-credentials flow).
      # Optional -- anonymous works at much lower quotas (~100 req/day).
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}

      PYTHONPATH: /app
    volumes:
      - .:/app
    networks:
      - alt-data-net
      - quantlab-net
    depends_on:
      alt-postgres:
        condition: service_healthy

# =============================================================================
# Volumes & Networks
# =============================================================================
volumes:
  timescaledb_data:
    driver: local
  pip_cache:
    driver: local
  alt_postgres_data:
    driver: local

networks:
  quantlab-net:
    driver: bridge
  alt-data-net:
    driver: bridge
