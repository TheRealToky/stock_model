name: stock_model

networks:
  net:

services:
  timescaledb:
    image: timescale/timescaledb:2.24.0-pg18
    shm_size: '2gb'
    container_name: stock_model-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - stock_data:/var/lib/postgresql/data
      - ./data:/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      timeout: 5s
    networks:
      - net

  pipeline:
    build:
      context: ./src/pipeline
      dockerfile: Dockerfile
    image: stock_model-pipeline:latest
    container_name: ohlcv_pipeline
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - ./src/pipeline:/app
      - ./data:/data
      - ./db:/app/db
    networks:
      - net

  weekly_update:
    build:
      context: ./src/weekly_update
      dockerfile: Dockerfile
    image: stock_model-weekly:latest
    container_name: ohlcv_weekly
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - ./src/weekly_update:/app
      - ./data:/data
      - ./db:/app/db
    networks:
      - net

volumes:
  stock_data:
