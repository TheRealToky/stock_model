services:
  timescaledb:
    image: timescale/timescaledb:2.24.0-pg18
    shm_size: '2gb'
    container_name: stock_model_db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - ./data:/data
      - stock_data:/var/lib/postgresql
    ports:
      - "5432:5432"

volumes:
  stock_data:
