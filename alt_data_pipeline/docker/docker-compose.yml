# =============================================================================
# Alt Data Pipeline -- Docker Compose
# =============================================================================
#
# Services:
#   alt-postgres       - PostgreSQL 16 dedicated to alternative data
#   alt-pipeline       - Python service container (ingestion / features / query)
#
# The existing quant-lab TimescaleDB container (from the root docker-compose.yml)
# is accessible from the alt-pipeline container via the shared ``quantlab-net``
# network created by the root compose stack.
#
# Usage (from the repo root):
#   docker compose -f docker-compose.yml -f alt_data_pipeline/docker/docker-compose.yml up -d
#
# Standalone (alt-data only, without the financial DB):
#   docker compose -f alt_data_pipeline/docker/docker-compose.yml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Alt-data PostgreSQL
  # ---------------------------------------------------------------------------
  alt-postgres:
    image: postgres:16
    container_name: alt-data-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ALT_DB_NAME:-alt_data}
      POSTGRES_USER: ${ALT_DB_USER:-alt_user}
      POSTGRES_PASSWORD: ${ALT_DB_PASSWORD:-alt_secret}
    ports:
      - "5433:5432"
    volumes:
      - alt_postgres_data:/var/lib/postgresql/data
    networks:
      - alt-data-net
      - quantlab-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ALT_DB_USER:-alt_user} -d ${ALT_DB_NAME:-alt_data}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Alt-data pipeline service
  # ---------------------------------------------------------------------------
  alt-pipeline:
    build:
      context: ../..
      dockerfile: alt_data_pipeline/docker/Dockerfile
    container_name: alt-data-pipeline
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      # Alt-data DB (inside the alt-data-net)
      ALT_DB_HOST: alt-postgres
      ALT_DB_PORT: "5432"
      ALT_DB_NAME: ${ALT_DB_NAME:-alt_data}
      ALT_DB_USER: ${ALT_DB_USER:-alt_user}
      ALT_DB_PASSWORD: ${ALT_DB_PASSWORD:-alt_secret}

      # Financial DB (lives on the quantlab-net)
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: "5432"
      TIMESCALE_DB: ${TIMESCALE_DB:-quantlab}
      TIMESCALE_USER: ${TIMESCALE_USER:-quantlab}
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-quantlab_secret}

      # OpenSky credentials (optional -- anonymous works with low quotas)
      OPENSKY_USERNAME: ${OPENSKY_USERNAME:-}
      OPENSKY_PASSWORD: ${OPENSKY_PASSWORD:-}

      PYTHONPATH: /app
    volumes:
      - ../..:/app
    networks:
      - alt-data-net
      - quantlab-net
    depends_on:
      alt-postgres:
        condition: service_healthy

volumes:
  alt_postgres_data:
    driver: local

networks:
  alt-data-net:
    driver: bridge
  # The quantlab-net is owned by the root docker-compose; declaring
  # it as external lets this stack attach without re-creating it.
  quantlab-net:
    external: true
